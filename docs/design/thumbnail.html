<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css"><style>html,body{margin:0;padding:0;width:1280px;height:854px;overflow:hidden}.tl{display:grid;grid-template-columns:1fr 160px;grid-template-rows:854px;width:1280px;height:854px}.tl__mark{display:flex;align-items:center;justify-content:center;background:var(--chrome-accent);color:var(--chrome-on-accent);font-family:var(--chrome-font);font-size:200px;font-weight:600;letter-spacing:-.03em;line-height:1;white-space:nowrap}.tl__strip{display:grid;grid-template-rows:repeat(4,1fr)}.tl__strip>div{width:100%;height:100%}</style></head>
<body><div class="tl"><div class="tl__mark">studio</div><div class="tl__strip"><div style="background:var(--chrome-scene)"></div><div style="background:var(--chrome-border)"></div><div style="background:var(--chrome-muted)"></div><div style="background:var(--chrome-danger)"></div></div></div></body></html>
